<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <radialGradient id="veil" cx="72%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="55%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="word"><rect x="64" y="96" width="700" height="170"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 13px; letter-spacing: 3px; fill: #8a8a8a; }
      .word { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 150px; fill: #f5f5f5; letter-spacing: -4px; }
      .serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 34px; fill: #9a9a9a; }
      .rise { animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both; }
      .r2 { animation-delay: .12s } .r3 { animation-delay: .3s } .r4 { animation-delay: .5s }
      @keyframes rise { from { transform: translateY(150px); } to { transform: translateY(0); } }
      .fade { animation: fade 1.4s ease .6s both; }
      @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
      .spin { transform-origin: 900px 180px; animation: spin 18s linear infinite; }
      .spin2 { transform-origin: 900px 180px; animation: spin 30s linear infinite reverse; }
      .spin3 { transform-origin: 900px 180px; animation: spin 46s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .light { animation: light 4.5s ease-in-out infinite; }
      @keyframes light { 0% { transform: translateX(-300px); } 60%, 100% { transform: translateX(1300px); } }
      .blink { animation: blink 1.6s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0.15 } }
      .grid line { stroke: #ffffff; stroke-opacity: .035; }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#veil)"/>
  <g class="grid">
    <line x1="164" y1="0" x2="164" y2="360"/><line x1="264" y1="0" x2="264" y2="360"/><line x1="364" y1="0" x2="364" y2="360"/>
    <line x1="464" y1="0" x2="464" y2="360"/><line x1="564" y1="0" x2="564" y2="360"/><line x1="664" y1="0" x2="664" y2="360"/>
    <line x1="764" y1="0" x2="764" y2="360"/><line x1="864" y1="0" x2="864" y2="360"/><line x1="964" y1="0" x2="964" y2="360"/>
    <line x1="1064" y1="0" x2="1064" y2="360"/>
  </g>

  <!-- Orbiting rings, like the client's home screen. -->
  <g fill="none" stroke="#ffffff">
    <circle cx="900" cy="180" r="70" stroke-opacity=".10"/>
    <circle cx="900" cy="180" r="120" stroke-opacity=".08"/>
    <circle cx="900" cy="180" r="180" stroke-opacity=".06"/>
    <circle cx="900" cy="180" r="250" stroke-opacity=".04"/>
  </g>
  <g class="spin"><circle cx="970" cy="180" r="4" fill="#f5f5f5"/></g>
  <g class="spin2"><circle cx="900" cy="60" r="3" fill="#cfcfcf"/></g>
  <g class="spin3"><circle cx="720" cy="180" r="2.5" fill="#a0a0a0"/></g>
  <!-- The J mark. -->
  <g class="fade" fill="#f5f5f5" transform="translate(870 150) scale(2.6)">
    <rect x="4" y="3" width="17" height="4"/><rect x="17" y="7" width="4" height="10"/><rect x="14" y="17" width="6" height="3"/>
    <rect x="7" y="20" width="10" height="3"/><rect x="3" y="13" width="4" height="8"/>
  </g>

  <text class="mono fade" x="64" y="56">JL — VOL. 01</text>
  <text class="mono fade" x="1136" y="56" text-anchor="end">MINECRAFT 1.21.11 · FABRIC</text>
  <line x1="64" y1="74" x2="1136" y2="74" stroke="#fff" stroke-opacity=".12"/>

  <g clip-path="url(#word)">
    <g class="rise"><text class="word" x="58" y="246">Jilaton</text></g>
  </g>
  <text class="serif fade" x="66" y="300">a Minecraft client for people who notice the details</text>

  <line x1="64" y1="326" x2="1136" y2="326" stroke="#fff" stroke-opacity=".10"/>
  <rect class="light" x="0" y="325" width="220" height="2" fill="url(#sweep)"/>
  <text class="mono" x="64" y="348">00 — README</text>
  <circle class="blink" cx="1060" cy="344" r="3.5" fill="#f5f5f5"/>
  <text class="mono" x="1136" y="348" text-anchor="end">LIVE</text>
</svg>
