plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'jilaton.refmap.json'
    }
    runs {
        // Isolated, scripted visual check: loads a copy of the test world, stages scenes, saves screenshots, quits.
        visualVerify {
            client()
            name = "Visual Verify"
            runDir = "run-verify"
            programArgs "--quickPlaySingleplayer", "Jilaton HUD verification"
            // 1920x1080 at GUI scale 2 is a 960x540 logical screen, which keeps the ClickGUI shell wide.
            programArgs "--width", "1920", "--height", "1080"
            vmArg "-Djilaton.visualVerify=true"
        }
        // Isolated world-FX capture (gate, glass, cyberspace, placement, shockwave): screenshots land in run-fx/screenshots.
        fxShots {
            client()
            name = "FX Shots"
            runDir = "run-fx"
            programArgs "--quickPlaySingleplayer", "Jilaton HUD verification"
            programArgs "--width", "1920", "--height", "1080"
            vmArg "-Djilaton.viewmodelShots=visuals"
        }
    }
}

group = project.maven_group
version = project.mod_version
base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)
    withSourcesJar()
}

sourceSets.main.java.srcDirs = ['src/main/java']

processResources {
    // Read once at configuration time: touching Task.project during execution is removed in Gradle 10.
    def modVersion = project.version
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
